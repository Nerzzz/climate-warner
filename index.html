<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Climate Warner</title>

        <link rel="shortcut icon" href="./assets/images/climate/day/mostly-clear.svg" type="image/x-icon">

        <link rel="stylesheet" href="./src/css/reset.css">
        <link rel="stylesheet" href="./src/css/variables.css">
        <link rel="stylesheet" href="./src/css/index.css">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.35.0/tabler-icons.min.css">

        <script type="module" src="./src/js/index.js"></script>
    </head>
    <body>
        <main>
            <section class="today-weather">
                <div class="current-weather">
                    <h2>Today Weather</h2>
                    <div class="content">
                        <img id="today-ilustration" src="./assets/images/climate/day/mostly-clear.svg">
                        <div class="current-stats">
                            <span id="current-temperature"></span>
                            <span id="current-like"></span>
                            <div class="preciptation">
                                <i class="ti ti-droplet-half-2-filled"></i>
                                <p id="current-prec-rate"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="hourly-weather">
                    <template id="hourly-item-template">
                        <div class="hourly-item" id="">
                            <span class="hour"></span>
                            <img class="ilustration" src="./assets/images/climate/day/mostly-clear.svg" alt="">
                            <div class="stats">
                                <div>
                                    <i class="ti ti-temperature"></i>
                                    <span class="temperature"></span>
                                </div>
                                <div>
                                    <i class="ti ti-cloud-rain"></i>
                                    <span class="probability"></span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </section>
        </main>
    </body>
</html>
